<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Счёт до 10 — цикл</title>

<!-- PWA-настройки -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a29bfe">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Счёт до 10">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow-y: auto;
  }
  body {
    font-family: 'Comic Sans MS', system-ui, sans-serif;
    background: linear-gradient(160deg, #ffeaa7, #a29bfe);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px;
  }
  .card {
    background: white;
    border-radius: 22px;
    padding: 14px 16px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    text-align: center;
  }
  h1 { font-size: 17px; color: #6c5ce7; margin-bottom: 8px; }

  .modes {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .modes button {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    padding: 8px 6px;
    border: 3px solid transparent;
    border-radius: 12px;
    background: #dfe6e9;
    color: #636e72;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modes button.active {
    background: #a29bfe;
    color: white;
    border-color: #6c5ce7;
  }
  .modes button:active { transform: scale(0.97); }

  .progress-bar {
    width: 100%;
    height: 10px;
    background: #dfe6e9;
    border-radius: 5px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #55efc4, #00b894);
    width: 0%;
    transition: width 0.4s;
  }

  .stars {
    margin-bottom: 6px;
    min-height: 34px;
    display: flex;
    justify-content: center;
  }
  .stars-count {
    color: #e17055;
    font-weight: bold;
    font-size: 22px;
    background: #fff5e6;
    padding: 6px 18px;
    border-radius: 12px;
    display: inline-block;
  }

  .task {
    font-size: 44px;
    font-weight: bold;
    color: #2d3436;
    margin: 6px 0;
    letter-spacing: 2px;
  }
  .answer-box {
    font-size: 44px;
    font-weight: bold;
    color: #0984e3;
    min-height: 54px;
    border-bottom: 4px dashed #b2bec3;
    display: inline-block;
    min-width: 80px;
    padding: 0 6px;
  }
  .feedback {
    font-size: 20px;
    min-height: 26px;
    margin: 6px 0;
    font-weight: bold;
  }
  .feedback.ok { color: #00b894; }
  .feedback.no { color: #e17055; }

  .dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 6px 0;
    min-height: 34px;
  }
  .dot-group {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-width: 120px;
    justify-content: center;
  }
  .dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #74b9ff;
  }
  .dot.plus { background: #ffeaa7; }
  .dot.crossed { background: #b2bec3; position: relative; }
  .dot.crossed::after {
    content: "✕";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d63031;
    font-size: 12px;
    font-weight: bold;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 8px;
  }
  .keypad button {
    font-size: 26px;
    font-weight: bold;
    padding: 10px 0;
    border: none;
    border-radius: 12px;
    background: #dfe6e9;
    color: #2d3436;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .keypad button:active { transform: scale(0.94); background: #b2bec3; }
  .keypad button.del { background: #fab1a0; }
  .keypad button.ok  { background: #55efc4; }

  .actions {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .actions button {
    font-size: 14px;
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: #a29bfe;
    color: white;
    cursor: pointer;
    font-family: inherit;
  }
  .actions button:active { transform: scale(0.96); }

  /* Экран финиша */
  .finish {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px 0;
  }
  .finish.show { display: flex; }
  .finish-title {
    font-size: 32px;
    color: #6c5ce7;
    font-weight: bold;
  }
  .finish-stars-count {
    font-size: 56px;
    color: #e17055;
    font-weight: bold;
    background: #fff5e6;
    padding: 16px 32px;
    border-radius: 20px;
    display: inline-block;
  }
  .finish-score {
    font-size: 22px;
    color: #e17055;
    font-weight: bold;
  }
  .finish-button {
    font-size: 20px;
    padding: 14px 28px;
    border: none;
    border-radius: 14px;
    background: #a29bfe;
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  .finish-button:active { transform: scale(0.96); }

  @media (max-height: 700px) {
    .task, .answer-box { font-size: 36px; }
    .keypad button { font-size: 22px; padding: 8px 0; }
    h1 { font-size: 15px; }
    .stars-count { font-size: 18px; padding: 4px 14px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>🧮 Счёт до 10 — цикл</h1>

  <!-- Экран игры -->
  <div id="gameScreen">
    <div class="modes">
      <button id="modeAdd" class="active" onclick="setMode('add')">➕ Сложение</button>
      <button id="modeSub" onclick="setMode('sub')">➖ Вычитание</button>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stars" id="stars"></div>

    <div class="task">
      <span id="a">3</span> <span id="op">+</span> <span id="b">5</span> =
      <span class="answer-box" id="answer">?</span>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="dots" id="dots"></div>

    <div class="keypad">
      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="del" onclick="del()">⌫</button>
      <button onclick="press('0')">0</button>
      <button class="ok" onclick="check()">✓</button>
    </div>

    <div class="actions">
      <button onclick="hint()">💡 Подсказка</button>
      <button onclick="newTask()">🔄 Пропустить</button>
    </div>
  </div>

  <!-- Экран финиша -->
  <div class="finish" id="finishScreen">
    <div class="finish-title">🎉 Цикл пройден!</div>
    <div id="finishStars"></div>
    <div class="finish-score" id="finishScore"></div>
    <button class="finish-button" onclick="restartCycle()">🔄 Ещё раз</button>
  </div>
</div>

<script>
let a, b, correct, input = "";
let mode = "add";
const MAX = 10;
const RETRY_AFTER = 4;

let allTasks = [];
let remaining = [];
let retryQueue = [];
let stars = 0;
let attemptCount = 0;

// ============ ГЕНЕРАЦИЯ ВСЕХ 45 ПРИМЕРОВ ============

function buildAllTasks(m) {
  const tasks = [];
  if (m === "add") {
    for (let i = 1; i <= MAX - 1; i++) {
      for (let j = 1; j <= MAX - i; j++) {
        tasks.push({ a: i, b: j, op: "+", correct: i + j });
      }
    }
  } else {
    for (let i = 2; i <= MAX; i++) {
      for (let j = 1; j <= i - 1; j++) {
        tasks.push({ a: i, b: j, op: "−", correct: i - j });
      }
    }
  }
  return tasks;
}

function shuffle(arr) {
  const arr2 = [...arr];
  for (let i = arr2.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr2[i], arr2[j]] = [arr2[j], arr2[i]];
  }
  return arr2;
}

// ============ ЗАПУСК ЦИКЛА ============

function setMode(m) {
  mode = m;
  document.getElementById("modeAdd").classList.toggle("active", m === "add");
  document.getElementById("modeSub").classList.toggle("active", m === "sub");
  restartCycle();
}

function restartCycle() {
  allTasks = buildAllTasks(mode);
  remaining = shuffle(allTasks);
  retryQueue = [];
  stars = 0;
  input = "";
  attemptCount = 0;

  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("finishScreen").classList.remove("show");

  updateStars();
  updateProgress();
  newTask();
}

// ============ ПОКАЗ ПРИМЕРА ============

function showTask(task) {
  a = task.a;
  b = task.b;
  correct = task.correct;

  document.getElementById("op").textContent = task.op;
  document.getElementById("a").textContent = a;
  document.getElementById("b").textContent = b;
  input = "";
  attemptCount = 0;
  document.getElementById("answer").textContent = "?";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("dots").innerHTML = "";
}

// ============ ВЫБОР СЛЕДУЮЩЕГО ПРИМЕРА ============

function newTask() {
  if (remaining.length === 0 && retryQueue.length === 0) {
    finishCycle();
    return;
  }

  for (let i = 0; i < retryQueue.length; i++) {
    retryQueue[i].wait--;
  }

  const readyIndex = retryQueue.findIndex(t => t.wait <= 0);
  if (readyIndex !== -1) {
    const task = retryQueue.splice(readyIndex, 1)[0];
    showTask(task);
  } else if (remaining.length > 0) {
    const task = remaining.shift();
    showTask(task);
  } else {
    showTask(generateTask());
  }
}

function generateTask() {
  if (mode === "add") {
    const na = Math.floor(Math.random() * (MAX - 1)) + 1;
    const nb = Math.floor(Math.random() * (MAX - na)) + 1;
    return { a: na, b: nb, op: "+", correct: na + nb };
  } else {
    const na = Math.floor(Math.random() * (MAX - 1)) + 2;
    const nb = Math.floor(Math.random() * (na - 1)) + 1;
    return { a: na, b: nb, op: "−", correct: na - nb };
  }
}

// ============ ВВОД ============

function press(n) {
  if (input.length >= 2) return;
  input += n;
  document.getElementById("answer").textContent = input;
}

function del() {
  input = input.slice(0, -1);
  document.getElementById("answer").textContent = input || "?";
}

// ============ ПРОВЕРКА ============

function check() {
  if (input === "") return;
  const val = parseInt(input, 10);
  const fb = document.getElementById("feedback");

  if (val === correct) {
    // ПРАВИЛЬНО
    if (attemptCount === 0) {
      stars++;    // звезда только если с первой попытки
    }
    fb.textContent = ["Молодец! 🎉", "Верно! ⭐", "Супер! 🌟", "Отлично! 👏"][Math.floor(Math.random()*4)];
    fb.className = "feedback ok";
    updateStars();
    updateProgress();

    setTimeout(newTask, 900);
  } else {
    // НЕПРАВИЛЬНО
    attemptCount++;
    fb.textContent = "Почти! Попробуй ещё 🙂";
    fb.className = "feedback no";

    const opText = document.getElementById("op").textContent;
    const alreadyQueued = retryQueue.some(t => t.a === a && t.b === b && t.op === opText);
    if (!alreadyQueued) {
      retryQueue.push({
        a: a,
        b: b,
        op: opText,
        correct: correct,
        wait: RETRY_AFTER
      });
    } else {
      const t = retryQueue.find(t => t.a === a && t.b === b);
      if (t) t.wait = RETRY_AFTER;
    }

    input = "";
    setTimeout(() => { document.getElementById("answer").textContent = "?"; }, 700);
  }
}

// ============ ПОДСКАЗКА ============

function hint() {
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  const g1 = document.createElement("div"); g1.className = "dot-group";

  if (document.getElementById("op").textContent === "+") {
    for (let i = 0; i < a; i++) {
      const d = document.createElement("div"); d.className = "dot"; g1.appendChild(d);
    }
    const g2 = document.createElement("div"); g2.className = "dot-group";
    for (let i = 0; i < b; i++) {
      const d = document.createElement("div"); d.className = "dot plus"; g2.appendChild(d);
    }
    dots.appendChild(g1);
    const plus = document.createElement("div");
    plus.style.fontSize = "26px";
    plus.style.color = "#636e72";
    plus.style.alignSelf = "center";
    plus.textContent = "+";
    dots.appendChild(plus);
    dots.appendChild(g2);
  } else {
    for (let i = 0; i < a; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i >= a - b ? " crossed" : "");
      g1.appendChild(d);
    }
    dots.appendChild(g1);
  }
}

// ============ ОТОБРАЖЕНИЕ ============

function updateStars() {
  document.getElementById("stars").innerHTML =
    '<span class="stars-count">⭐ ' + stars + ' из 45</span>';
}

function updateProgress() {
  const total = allTasks.length;
  const solved = total - remaining.length - retryQueue.length;
  const percent = (solved / total) * 100;
  document.getElementById("progressFill").style.width = percent + "%";
}

// ============ ФИНИШ ============

function finishCycle() {
  document.getElementById("gameScreen").style.display = "none";
  const fs = document.getElementById("finishScreen");
  fs.classList.add("show");

  document.getElementById("finishStars").innerHTML =
    '<span class="finish-stars-count">⭐ ' + stars + ' из 45</span>';

  let message = "";
  if (stars === 45) message = "🏆 Идеально! Все 45 примеров с первой попытки!";
  else if (stars >= 40) message = "🌟 Отлично! Очень близко к идеалу!";
  else if (stars >= 30) message = "👍 Хорошо! Продолжай тренироваться!";
  else message = "💪 Неплохо! Попробуй ещё раз — будет лучше!";

  document.getElementById("finishScore").innerHTML =
    message + "<br><br>Собрано звёзд: <b>" + stars + " из 45</b>";
}

// ============ СТАРТ ============

restartCycle();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
